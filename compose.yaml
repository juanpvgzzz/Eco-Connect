services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ecoconecta
      POSTGRES_USER: ecoconecta
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "ecoconecta", "-d", "ecoconecta"]
      interval: 3s
      timeout: 3s
      retries: 20
  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:?Define DATABASE_URL in .env}
      ECO_PILOT_ID: ${ECO_PILOT_ID:?Define ECO_PILOT_ID in .env}
    command: ["sh", "-c", "python -m db.migrate && exec uvicorn backend.app.main:app --host 0.0.0.0 --port 8000"]
    ports:
      - "127.0.0.1:8000:8000"
volumes:
  pgdata:
